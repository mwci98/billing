  <text x="64" y="345" fill="#dceae4" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600">Bill fast. Stay in control.</text>
  <text x="64" y="384" fill="#93aaa1" font-family="Arial, Helvetica, sans-serif" font-size="20">POS billing, inventory, restaurant orders and receipts.</text>
