<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#00BC7D" />
    <meta name="application-name" content="QPOS" />
    <meta name="description" content="QPOS point of sales and inventory management." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QPOS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest?v=qpos-icon-4" />
    <link rel="icon" type="image/svg+xml" href="/icons/qpos-logo.svg" />
    <link rel="alternate icon" type="image/png" href="/icons/icon-192.png?v=qpos-icon-4" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=qpos-icon-4" />
    <title>QPOS – Point of Sales</title>
    <style>
      #qpos-startup-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #07110D; }
      #qpos-startup-splash::before { content: ''; position: absolute; width: 28rem; height: 28rem; border-radius: 999px; background: rgba(0,188,125,.16); filter: blur(96px); }
      #qpos-startup-splash img { position: relative; width: 6rem; height: 6rem; animation: qpos-startup-pulse 1.3s ease-in-out infinite; }
      @keyframes qpos-startup-pulse { 50% { transform: scale(1.06); } }
    </style>
    <script>
      if (new URLSearchParams(window.location.search).get('refresh') === 'qpos') {
        Promise.all([
          'serviceWorker' in navigator
            ? navigator.serviceWorker.getRegistrations().then((registrations) =>
                Promise.all(registrations.map((registration) => registration.unregister())),
              )
            : Promise.resolve(),
          'caches' in window
            ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
            : Promise.resolve(),
        ]).finally(() => {
          window.location.replace('/?updated=' + Date.now());
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="qpos-startup-splash" role="status" aria-label="Loading QPOS"><img src="/icons/qpos-logo.svg" alt="QPOS" /></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
