<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="application-name" content="QPOS" />
    <meta name="description" content="QPOS point of sales and inventory management." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QPOS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest?v=qpos-icon-2" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png?v=qpos-icon-2" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=qpos-icon-2" />
    <title>QPOS – Point of Sales</title>
    <script>
      if (new URLSearchParams(window.location.search).get('refresh') === 'qpos') {
        Promise.all([
          'serviceWorker' in navigator
            ? navigator.serviceWorker.getRegistrations().then((registrations) =>
                Promise.all(registrations.map((registration) => registration.unregister())),
              )
            : Promise.resolve(),
          'caches' in window
            ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
            : Promise.resolve(),
        ]).finally(() => {
          window.location.replace('/?updated=' + Date.now());
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
