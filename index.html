    <title>QPOS Billing, POS & Inventory Management Software | Kohima, India</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "QPOS",
        "url": "https://qpos.neospec.co.in/",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Point of Sale Software",
        "operatingSystem": "Web",
        "description": "Billing, POS and inventory management software for retail, service, hybrid and restaurant businesses in Kohima, Nagaland and across India.",
        "keywords": "billing software, POS software, QPOS, inventory management software, billing software in Kohima, POS software in Kohima, inventory management in Kohima",
        "offers": {
          "@type": "Offer",
          "price": "6000",
          "priceCurrency": "INR",
          "category": "annual subscription",
          "areaServed": [
            {"@type": "City", "name": "Kohima"},
            {"@type": "AdministrativeArea", "name": "Nagaland"},
            {"@type": "Country", "name": "India"}
          ]
        },
        "publisher": {"@type": "Organization", "name": "Neospec Services", "url": "https://neospec.co.in/"}
      }
    </script>
    <style>
      #qpos-startup-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #090909; }
      #qpos-startup-splash::before { content: ''; position: absolute; width: 28rem; height: 28rem; border-radius: 999px; background: rgba(255,185,0,.14); filter: blur(96px); }
      #qpos-startup-splash img { position: relative; width: 6rem; height: 6rem; animation: qpos-startup-pulse 1.3s ease-in-out infinite; }
      @keyframes qpos-startup-pulse { 50% { transform: scale(1.06); } }
    </style>
    <script>
      if (new URLSearchParams(window.location.search).get('refresh') === 'qpos') {
        Promise.all([
          'serviceWorker' in navigator
            ? navigator.serviceWorker.getRegistrations().then((registrations) =>
                Promise.all(registrations.map((registration) => registration.unregister())),
              )
            : Promise.resolve(),
          'caches' in window
            ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
            : Promise.resolve(),
        ]).finally(() => {
          window.location.replace('/?updated=' + Date.now());
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="qpos-startup-splash" role="status" aria-label="Loading QPOS"><img src="/icons/qpos-marketing-logo.svg" alt="QPOS" /></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
